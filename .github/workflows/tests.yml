name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python scripts/check_secrets.py
      - run: python scripts/validate_release.py
      - run: python scripts/summarize_results.py
      - run: LANGSMITH_TRACING=false python -m pytest -q
